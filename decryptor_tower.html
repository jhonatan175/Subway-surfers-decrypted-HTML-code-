<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descriptografador Subway Surfers - JSON</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0e14;color:#e1e8f0;font-family:sans-serif;padding:10px;min-height:100vh;}
.container{max-width:500px;margin:0 auto;background:#161c27;border-radius:12px;border:2px solid #2d3748;padding:15px;}
h1{text-align:center;font-size:15px;color:#00d2ff;margin-bottom:15px;}
.aviso{background:#1a2a3a;border:1px solid #00d2ff;border-radius:8px;padding:10px;margin-bottom:15px;font-size:12px;}
.aviso.erro{border-color:#ff4444;background:#3a1a1a;color:#ff8888;}
.aviso.ok{border-color:#00ff88;background:#1a3a2a;color:#88ffaa;}
.file-area{background:#1e2633;border:2px dashed #00d2ff;border-radius:10px;padding:20px;text-align:center;margin-bottom:15px;cursor:pointer;}
.file-area.dragover{background:#2a3a4a;}
input[type="file"]{display:none;}
.label-file{color:#00d2ff;font-weight:bold;cursor:pointer;}
textarea{width:100%;height:300px;background:#0d1117;color:#9cdcfe;border:none;border-radius:8px;padding:12px;font-family:monospace;font-size:12px;resize:vertical;margin-bottom:15px;}
button{width:100%;padding:15px;font-size:15px;font-weight:bold;border:none;border-radius:10px;cursor:pointer;text-transform:uppercase;}
.btn-cripto{background:linear-gradient(90deg,#00d2ff,#00ff88);color:#000;margin-bottom:10px;}
.btn-cripto:active{transform:scale(0.98);}
.status{font-size:11px;color:#888;margin-top:10px;text-align:center;}
</style>
</head>
<body>
<div class="container">
<h1>🔓 Editor Subway Surfers → JSON</h1>
<div class="aviso" id="aviso">
📌 Carregue o arquivo .bin → edite → clique no botão → baixa .json direto!
</div>
<div class="file-area" id="dropArea">
<label class="label-file" for="fileInput">
📂 TOQUE PARA ESCOLHER O ARQUIVO<br>
<small>arquivo .bin do jogo</small>
</label>
<input type="file" id="fileInput" accept=".bin,.json">
</div>
<textarea id="editor" placeholder="O conteúdo aparece aqui depois de carregar o arquivo..."></textarea>
<button class="btn-cripto" id="btnCripto" onclick="criptografarEBaixar()">🔒 CRIPTOGRAFAR E BAIXAR .JSON</button>
<div class="status" id="status">Nenhum arquivo carregado ainda</div>
</div>

<script>
const HEADER_SIZE = 32;
const COUNTER_SIZE = 16;
const KEY_SIZE = 16;

let counterOriginal = null;
let keyOriginal = null;
let nomeArquivo = "perfil.json";

const fileInput = document.getElementById('fileInput');
const editor = document.getElementById('editor');
const aviso = document.getElementById('aviso');
const status = document.getElementById('status');
const dropArea = document.getElementById('dropArea');

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) carregarArquivo(e.target.files[0]);
});

async function carregarArquivo(arquivo) {
  nomeArquivo = arquivo.name.replace('.bin', '.json');
  status.textContent = `Carregando: ${arquivo.name}...`;
  
  const buf = await arquivo.arrayBuffer();
  
  try {
    const dec = await descriptografar(buf);
    counterOriginal = dec.counter;
    keyOriginal = dec.key;
    editor.value = dec.texto;
    aviso.className = 'aviso ok';
    aviso.innerHTML = '✅ Arquivo carregado e descriptografado! Edite e clique em BAIXAR.';
    status.textContent = `Chaves originais preservadas ✅ | Tamanho: ${dec.texto.length} caracteres`;
  } catch (erro) {
    editor.value = "Erro ao descriptografar: " + erro.message;
    aviso.className = 'aviso erro';
    aviso.innerHTML = '❌ Arquivo incompatível ou corrompido.';
    status.textContent = 'Erro';
  }
}

async function descriptografar(dados) {
  if (dados.byteLength < HEADER_SIZE) throw new Error("Arquivo muito pequeno");
  
  const c = new Uint8Array(dados.slice(0, COUNTER_SIZE));
  const k = new Uint8Array(dados.slice(COUNTER_SIZE, HEADER_SIZE));
  const textoCifrado = new Uint8Array(dados.slice(HEADER_SIZE));
  
  const chaveCrypto = await crypto.subtle.importKey("raw", k, {name:"AES-CTR"}, false, ["decrypt"]);
  const decifrado = await crypto.subtle.decrypt(
    {name:"AES-CTR", counter:c, length:128}, chaveCrypto, textoCifrado
  );
  
  return {
    texto: new TextDecoder().decode(decifrado),
    counter: c,
    key: k
  };
}

async function criptografarEBaixar() {
  if (!counterOriginal || !keyOriginal) {
    alert("⚠️ Carregue um arquivo primeiro!");
    return;
  }
  
  let texto = editor.value;
  try {
    JSON.parse(texto);
  } catch (e) {
    alert("⚠️ JSON inválido! Verifique vírgulas, aspas, chaves.");
    return;
  }
  
  const bytes = new TextEncoder().encode(texto);
  const chaveCrypto = await crypto.subtle.importKey("raw", keyOriginal, {name:"AES-CTR"}, false, ["encrypt"]);
  const cifrado = await crypto.subtle.encrypt(
    {name:"AES-CTR", counter:counterOriginal, length:128}, chaveCrypto, bytes
  );
  
  const resultado = new Uint8Array(HEADER_SIZE + cifrado.byteLength);
  resultado.set(counterOriginal, 0);
  resultado.set(keyOriginal, COUNTER_SIZE);
  resultado.set(new Uint8Array(cifrado), HEADER_SIZE);
  
  const blob = new Blob([resultado], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nomeArquivo;
  a.click();
  URL.revokeObjectURL(url);
  
  aviso.className = 'aviso ok';
  aviso.innerHTML = `✅ BAIXADO: ${nomeArquivo}`;
  status.textContent = "Pronto! Substitua o arquivo no jogo.";
}
</script>
</body>
</html>
